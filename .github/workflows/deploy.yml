name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Rewrite absolute URLs for project subpath
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path

          pat = re.compile(r'((?:href|src|content)=")/(?!/)(?!ars-engineers)')
          for f in Path("dist").rglob("*.html"):
              s = f.read_text(encoding="utf-8")
              s2, n = pat.subn(r"\1/ars-engineers/", s)
              if n:
                  f.write_text(s2, encoding="utf-8", newline="\n")
                  print(f"{f}: {n} urls rewritten")
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
